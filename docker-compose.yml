services:
  api:
    image: ai-meeting-assistance:latest
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./database:/app/database

  ui:
    image: ai-meeting-assistance:latest
    build: .
    command: streamlit run ui/streamlit_app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000/summarize
    depends_on:
      - api
